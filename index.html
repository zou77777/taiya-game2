<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D インド式タイヤ飛ばし</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #e3c58d; }
        /* 記録表示用パネルのスタイル */
        #result {
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            border: 4px solid #e3c58d;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="result">
        <h1 style="margin: 0; color: #e3c58d;">記録達成！</h1>
        <div id="distance" style="font-size: 80px; margin: 20px 0;">0m</div>
        <p>【F5キー】で再挑戦</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="taiya.js"></script>
</body>
</html>
